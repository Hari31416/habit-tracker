name: habit_tracker
description: "Phial: Habit Tracker & Focus - Fully offline habit tracker & focus companion."
publish_to: 'none'

version: 0.8.0-alpha.1+9

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter

  # State Management & DI
  flutter_riverpod: ^2.6.1

  # Local Persistence
  drift: ^2.24.2
  sqlite3_flutter_libs: ^0.5.28
  path_provider: ^2.1.5
  path: ^1.9.0

  # Utilities
  intl: ^0.20.2
  uuid: ^4.5.1
  shared_preferences: ^2.3.2

  # Notifications & Timezones
  flutter_local_notifications: ^22.3.0
  flutter_timezone: ^5.1.0
  timezone: ^0.11.0

  # Icons
  cupertino_icons: ^1.0.8
  material_design_icons_flutter: ^7.0.7296

  # Audio
  audioplayers: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Code Generation
  build_runner: ^2.4.15
  drift_dev: ^2.24.2

flutter:
  uses-material-design: true
  assets:
    - assets/audio/

