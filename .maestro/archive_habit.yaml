# Create habit → open detail → archive → gone from Today.
#
# Avoid hideKeyboard: on Android it sends Back and dismisses the modal sheet.

appId: app.phial.habits
tags:
  - journey
  - ci
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: "nav_today"
    timeout: 30000
- runFlow:
    file: helpers/open_add_habit.yaml
- tapOn:
    id: "habit_form_title"
- inputText: "Maestro Archive Habit"
- assertVisible: "Maestro Archive Habit"
- runFlow:
    file: helpers/dismiss_stylus_prompt.yaml
- tapOn: "Description (optional)"
- runFlow:
    file: helpers/save_habit_form.yaml
- extendedWaitUntil:
    visible: "Open Maestro Archive Habit"
    timeout: 10000
- tapOn: "Open Maestro Archive Habit"
- extendedWaitUntil:
    visible:
      id: "habit_detail_menu"
    timeout: 10000
- tapOn:
    id: "habit_detail_menu"
- tapOn: "Archive Habit"
- runFlow:
    when:
      visible:
        id: "habit_detail_menu"
    commands:
      - tapOn: "Back"
- extendedWaitUntil:
    visible:
      id: "nav_today"
    timeout: 10000
- assertNotVisible: "Open Maestro Archive Habit"
- assertNotVisible: "Check in Maestro Archive Habit"
