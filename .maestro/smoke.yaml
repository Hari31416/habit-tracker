# Maestro device smoke (black-box, installed APK).
# Suite: make maestro  → smoke + journeys under .maestro/
# Single flow: make maestro-smoke
#
# Selectors use Semantics.identifier (id:) — not Flutter Keys.
# Flutter merges Text widgets into one accessibility node; prefer id: or labels.

appId: app.phial.habits
tags:
  - smoke
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: "nav_today"
    timeout: 15000
# Fresh install has categories only — load starter habits when empty.
- runFlow:
    when:
      visible: "Load Demo Habits"
    commands:
      - tapOn: "Load Demo Habits"
      - extendedWaitUntil:
          visible:
            id: "habit_check_seed_habit_meditation"
          timeout: 10000
- extendedWaitUntil:
    visible:
      id: "habit_check_seed_habit_meditation"
    timeout: 10000
- tapOn:
    id: "habit_check_seed_habit_meditation"
- tapOn:
    id: "nav_week"
- assertVisible: "Week Matrix"
- tapOn:
    id: "nav_analytics"
- assertVisible: "Analytics"
- tapOn:
    id: "nav_mastery"
- assertVisible: "Mastery & Badges"
- tapOn:
    id: "nav_today"
- assertVisible:
    id: "habit_check_seed_habit_meditation"
