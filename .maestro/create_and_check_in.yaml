# Create boolean habit → check-in → undo (asserts completion semantics).
# Form defaults: daily + boolean, promptReflection off.
#
# Avoid hideKeyboard: on Android it sends Back and dismisses the modal sheet.

appId: app.phial.habits
tags:
  - journey
  - ci
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: "nav_today"
    timeout: 30000
- runFlow:
    file: helpers/open_add_habit.yaml
- tapOn:
    id: "habit_form_title"
- inputText: "Maestro Check Habit"
- assertVisible: "Maestro Check Habit"
- runFlow:
    file: helpers/dismiss_stylus_prompt.yaml
- tapOn: "Description (optional)"
- runFlow:
    file: helpers/save_habit_form.yaml
- extendedWaitUntil:
    visible: "Check in Maestro Check Habit"
    timeout: 10000
- tapOn: "Check in Maestro Check Habit"
- extendedWaitUntil:
    visible: "Undo check-in Maestro Check Habit"
    timeout: 10000
- tapOn: "Undo check-in Maestro Check Habit"
- extendedWaitUntil:
    visible: "Check in Maestro Check Habit"
    timeout: 10000
