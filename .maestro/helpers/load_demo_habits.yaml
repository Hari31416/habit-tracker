appId: app.phial.habits
---
- runFlow:
    when:
      notVisible:
        id: "btn_start_routine_seed_routine_morning"
    commands:
      - scrollUntilVisible:
          element: "Load Demo Habits"
          direction: DOWN
          timeout: 15000
      - tapOn: "Load Demo Habits"
      - extendedWaitUntil:
          visible:
            id: "btn_start_routine_seed_routine_morning"
          timeout: 15000
