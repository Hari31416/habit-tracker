name: Flutter CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - 'plans/**'
  pull_request:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - 'plans/**'

jobs:
  test_and_build:
    name: Test & Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Regenerate Drift code and fail on dirty tree
        run: |
          dart run build_runner build --delete-conflicting-outputs
          if ! git diff --exit-code -- 'lib/**/*.g.dart' 'lib/**/*.drift.dart'; then
            echo "Generated Drift/Riverpod files are stale. Run make codegen and commit."
            exit 1
          fi

      - name: Run code analysis (lint)
        run: flutter analyze

      - name: Run unit & widget tests with coverage
        run: flutter test --coverage

      - name: Enforce domain+data coverage floor
        run: python3 scripts/check_domain_data_coverage.py

      - name: Build Debug APK
        run: flutter build apk --debug --android-skip-build-dependency-validation
