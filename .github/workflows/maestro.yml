name: Maestro Suite

on:
  workflow_dispatch:
    inputs:
      suite:
        description: 'Maestro test suite to run'
        required: true
        default: 'subset'
        type: choice
        options:
          - subset
          - full
  schedule:
    - cron: '0 6 * * *' # daily 06:00 UTC

jobs:
  maestro:
    name: Emulator Maestro Suite
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build debug APK
        run: flutter build apk --debug --android-skip-build-dependency-validation

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install Maestro CLI
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Run Maestro suite on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          force-avd-creation: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            adb install -r build/app/outputs/flutter-apk/app-debug.apk
            SUITE="${{ github.event.inputs.suite || 'subset' }}"
            echo "Running Maestro suite mode: $SUITE"
            if [ "$SUITE" = "full" ]; then
              FLOWS=$(ls .maestro/*.yaml | sort)
            else
              FLOWS=".maestro/smoke.yaml .maestro/create_and_check_in.yaml .maestro/archive_habit.yaml"
            fi
            # One flow at a time so CI logs include per-step Maestro output.
            for flow in $FLOWS; do
              echo "=== $flow ==="
              maestro test "$flow"
            done
